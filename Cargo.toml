[workspace]
members = [
    "topograph-core",
    "topograph"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Brandon"]

[workspace.dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
cairo-rs = "0.20"
tokio = { version = "1.0", features = ["full"] }
jwalk = "0.8"
