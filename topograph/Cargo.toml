[package]
name = "topograph"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Qt6/QML file system size explorer styled with Kanagawa Dragon"
build = "build.rs"

[dependencies]
cxx = "1.0" # required by cxx-qt codegen; no direct use in our code
cxx-qt = "0.6"
cxx-qt-lib = "0.6"
topograph-core = { path = "../topograph-core" }

[build-dependencies]
cxx-qt-build = "0.6"
